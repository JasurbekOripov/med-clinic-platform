spring:
  application:
    name: vendor-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/vendor}
    username: ${DB_USER:vendor}
    password: ${DB_PASSWORD:vendor}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: ${SESSION_IDLE_TIMEOUT:30m}
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */5 * * * *"
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:false}

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

vendor:
  security:
    session-absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:12h}
    session-cookie-secure: ${SESSION_COOKIE_SECURE:true}
    bootstrap-owner:
      login: ${VENDOR_BOOTSTRAP_OWNER_LOGIN:}
      password: ${VENDOR_BOOTSTRAP_OWNER_PASSWORD:}
      full-name: ${VENDOR_BOOTSTRAP_OWNER_FULL_NAME:Owner}
  licensing:
    signing:
      key-id: ${LICENSE_SIGNING_KEY_ID:vk-dev-1}
      private-key-path: ${LICENSE_SIGNING_KEY_PATH:}
      generate-if-missing: ${LICENSE_SIGNING_GENERATE_IF_MISSING:false}
  devices:
    pairing-code-ttl: ${PAIRING_CODE_TTL:24h}
    heartbeat-interval: ${HEARTBEAT_INTERVAL:60s}
  monitoring:
    offline-after: ${MONITORING_OFFLINE_AFTER:10m}
    heartbeat-retention: ${MONITORING_HEARTBEAT_RETENTION:30d}
