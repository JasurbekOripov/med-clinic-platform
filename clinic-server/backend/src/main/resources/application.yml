spring:
  application:
    name: clinic-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/clinic}
    username: ${DB_USER:clinic}
    password: ${DB_PASSWORD:clinic}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
  session:
    timeout: ${SESSION_IDLE_TIMEOUT:12h}
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 */5 * * * *"
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: ${PORT:8081}
  forward-headers-strategy: framework
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      console: ${LOG_FORMAT:ecs}

clinic:
  security:
    # Clinic staff work full shifts; the screen lock (Settings → idle minutes) protects shared PCs in between.
    session-absolute-timeout: ${SESSION_ABSOLUTE_TIMEOUT:14h}
    session-cookie-secure: ${SESSION_COOKIE_SECURE:true}
  vendor:
    secret-key-path: ${CLINIC_SECRET_KEY_PATH:./data/secret.key}
    allow-insecure-url: ${CLINIC_VENDOR_ALLOW_HTTP:false}
